<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- The site sends Referrer-Policy: same-origin. Google checks the Maps key against the page's address, so this page
     tells Google its origin (only the origin, never the path). DP-08 round 11. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Directory</title>
<link rel="preload" href="/fonts/InstrumentSans-Bold.ttf" as="font" type="font/ttf" crossorigin>
<link rel="stylesheet" href="/display.css">
</head>
<body>
<div id="stage" class="is-loading">
  <div id="bg" class="bg" aria-hidden="true" hidden></div>
  <header class="masthead">
    <div class="masthead-id">
      <img id="logo" class="logo" alt="" hidden>
      <h1 id="property" class="property"></h1>
      <p id="label" class="label" hidden></p>
    </div>
    <div class="masthead-now">
      <div id="time" class="time"></div>
      <div id="date" class="date"></div>
      <div id="weather" class="weather" hidden>
        <span id="wx-icon" class="wx-icon" aria-hidden="true"></span>
        <span id="wx-temp" class="wx-temp"></span>
        <span id="wx-text" class="wx-text"></span>
      </div>
    </div>
  </header>

  <section class="listing" aria-label="Tenant directory">
    <div class="listing-head"><span id="listing-tenant">Tenant</span><span>Suite</span></div>
    <div id="list-frame" class="list-frame">
      <ol id="tenants" class="tenants"></ol>
    </div>
    <!-- Touch screens (DP-09 round 15): the accessible keyboard's button and the A to Z strip, in reach -->
    <div id="touchbar" class="touchbar" hidden>
      <button type="button" id="kbd-btn" class="kbd-btn" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2"/><path d="M6 10h1M9 10h1M12 10h1M15 10h1M18 10h0.5M6 13h1M9 13h1M12 13h1M15 13h1M18 13h0.5M8 16h8"/></svg><span>Search</span></button>
      <div id="az" class="az" hidden></div>
    </div>
  </section>

  <section id="news" class="news" hidden aria-live="off">
    <div id="news-slides" class="news-slides"></div>
  </section>

  <footer class="contacts">
    <div id="managed" class="contact"></div>
    <div id="leased" class="contact"></div>
    <!-- Directory to Go (DP-08 round 12): a QR code to this directory on a phone; the customer switches it on -->
    <div id="togo" class="togo" hidden><p id="togo-line" class="togo-line"></p><div id="togo-code" class="togo-code"></div></div>
  </footer>

  <p id="welcome" class="welcome" hidden></p>
  <div id="brand" class="brand" hidden><img id="brand-logo" alt=""></div>
  <p id="powered" class="powered" hidden>Powered by WayTuGo · waytugo.com</p>
  <!-- Touch screens: a company's card, and the on-screen keyboard -->
  <div id="kbd" class="kbd" hidden></div>
  <div id="card" class="card" hidden></div>
  <div id="identify" class="identify" hidden></div>
  <p id="offline" class="offline" hidden>Showing saved information. Reconnecting…</p>
</div>
<script src="/vendor/qrcode.js"></script>
<script src="/display.js"></script>
</body>
</html>
