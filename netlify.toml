[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Display assets: always revalidate so screens pick up code changes on their nightly reload.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The layout format (DP-11, E1a) is a JavaScript module shared by the layout page, the console and the site; a module
# must be served as JavaScript, and always revalidated like the display's own code.
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Signed-in pages: never framed by other sites, never cached.
[[headers]]
  for = "/console.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[[headers]]
  for = "/edit.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[[headers]]
  for = "/tech.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[[headers]]
  for = "/tech.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/login.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"
