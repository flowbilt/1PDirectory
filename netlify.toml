[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# Display assets: always revalidate so screens pick up code changes on their nightly reload.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "same-origin"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The layout format (DP-11, E1a) is a JavaScript module shared by the layout page, the console and the site; a module
# must be served as JavaScript, and always revalidated like the display's own code.
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    # E1c: the phone menu is shown on waytugo.com and uses these fonts from here
    Access-Control-Allow-Origin = "*"

# Signed-in pages: never framed by other sites, never cached.
[[headers]]
  for = "/console.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[[headers]]
  for = "/edit.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[[headers]]
  for = "/tech.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

[[headers]]
  for = "/tech.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

[[headers]]
  for = "/login.html"
  [headers.values]
    X-Frame-Options = "DENY"
    Cache-Control = "no-store"

# Pictures (DP-11, E1b): a layout's pictures live in Supabase Storage (the public "layout-images" bucket, made by
# supabase/30-layout-images.sql) and are served through this site at /img/<account>/<key>-<random>.webp, so screens and
# the console only ever see this site's address. A picture's file never changes once uploaded (a new upload is a new
# file), so it's cached for a year: by the browser here, and by each screen's offline cache (sw.js), which fetches it once.
# The address below is the project's public URL (the same one /api/config gives every browser); no key is involved.
[[redirects]]
  from = "/img/*"
  to = "https://pconzpqfqyduxtismnxz.supabase.co/storage/v1/object/public/layout-images/:splat"
  status = 200
  force = true

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
